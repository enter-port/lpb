# Config for evaluating the OFFICIAL pretrained LPB checkpoints.
# Same hyperparameters as eval_transport.yaml, only the checkpoint paths differ.

hydra:
  run:
    dir: .

# Official checkpoints
dynamics_model_checkpoint: '/inspire/hdd/project/robot-dna/baojiachun-CZXS25130063/lpb/ckpts/official/dyn_model/checkpoints/model_60.pth'
policy_checkpoint: '/inspire/hdd/project/robot-dna/baojiachun-CZXS25130063/lpb/ckpts/official/base_policy/checkpoints/270.ckpt'

guidance_start_timestep: 10
guidance_scale: 0.2

threshold: 2.8
n_test: 50
test_start_seed: 100000
n_action_steps: 15

output_dir: 'data/official_transport_test'

device: "cuda"

# Environment runner configuration
env_runner_target: 'diffusion_policy.env_runner.robomimic_image_sequential_runner.SequentialRobomimicImageRunner'

# Planner configuration
planner_target: 'dyn_model.planner.Planner'

# Demo dataset path (20% expert demos — same file used for base policy training)
demo_dataset_path: '/inspire/hdd/project/robot-dna/baojiachun-CZXS25130063/lpb/data/transport/data/expert_demonstration/transport_ph_demo_v141_20_perc.hdf5'
